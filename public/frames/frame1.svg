<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c86a"/>
      <stop offset="35%" stop-color="#c8a040"/>
      <stop offset="65%" stop-color="#9a7828"/>
      <stop offset="100%" stop-color="#6b5010"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6a8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b5010" stop-opacity="0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="400" height="520" fill="white"/>
      <rect x="58" y="72" width="284" height="376" rx="2" fill="black"/>
    </mask>
  </defs>
  <rect width="400" height="520" fill="url(#gold)" mask="url(#hole)"/>
  <rect width="400" height="520" fill="url(#goldHi)" mask="url(#hole)" opacity="0.5"/>
  <!-- outer lip -->
  <rect x="4" y="4" width="392" height="512" fill="none" stroke="#f0d878" stroke-width="3" mask="url(#hole)" opacity="0.7"/>
  <rect x="12" y="12" width="376" height="496" fill="none" stroke="#5a4010" stroke-width="2" mask="url(#hole)"/>
  <!-- inner lip -->
  <rect x="50" y="64" width="300" height="392" fill="none" stroke="#f0d878" stroke-width="2" mask="url(#hole)" opacity="0.5"/>
  <rect x="58" y="72" width="284" height="376" fill="none" stroke="#4a3810" stroke-width="1.5" mask="url(#hole)"/>
  <!-- corner ornaments -->
  <g fill="#f0d878" opacity="0.85" mask="url(#hole)">
    <circle cx="32" cy="32" r="8"/><circle cx="368" cy="32" r="8"/>
    <circle cx="32" cy="488" r="8"/><circle cx="368" cy="488" r="8"/>
  </g>
  <g fill="none" stroke="#5a4010" stroke-width="1" opacity="0.6" mask="url(#hole)">
    <path d="M32 48 Q48 32 64 32"/><path d="M336 32 Q352 32 368 48"/>
    <path d="M32 472 Q48 488 64 488"/><path d="M336 488 Q352 488 368 472"/>
  </g>
</svg>
